name: CI

# Build check for every pull request (any base branch) and every push to main.
# No secrets. The Next.js build does not need Supabase, Razorpay, Resend, or
# other API keys at build time.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # package.json has no engines field. @types/node is ^22, and Next.js 15
          # supports Node 22.
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate platform pages
        run: npm run validate:platforms

      - name: Validate internal links
        run: npm run validate:links

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
